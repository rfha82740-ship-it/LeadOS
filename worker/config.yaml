# ============================================================
# LeadOS Worker — الإعدادات المركزية (كل التنظيم الذكي هنا)
# عدّل الملف ده أو تجاوز أي قيمة بمتغيرات بيئة LEADOS_* / WORKER_*
# ============================================================

# --- الاتصال بـ LeadOS ---
leados:
  base_url: "http://localhost:3000"     # على Railway/VPS حط رابط تطبيقك على Vercel
  api_key: ""                            # نفس قيمة INGEST_API_KEY في .env بتاع LeadOS
  timeout_seconds: 240
  batch_size: 8                         # إرسال النتايج على دفعات صغيرة مش دفعة واحدة

# --- الوضع العام ---
worker:
  mode: "once"                           # once = دورة واحدة (GitHub Actions) | loop = دائم (VPS/Railway)
  loop_interval_minutes: 180             # كل كام ساعة يعمل دورة في وضع loop (مع عشوائية ±15%)
  max_items_per_platform_per_cycle: 25   # سقف النتايج لكل منصة في الدورة الواحدة

# --- الميزانيات اليومية (تنظيم منع الحظر) ---
budgets:
  daily:
    GOOGLE_MAPS: 60                      # أقصى استعلامات خرائط/يوم
    FACEBOOK: 20
    INSTAGRAM: 20
    LINKEDIN: 15
    DIRECTORY: 20
  # لو المنصة اتجمعت اليوم (circuit breaker) تتقفل لباقي اليوم تلقائيًا

# --- التأخيرات البشرية (ثواني) ---
delays:
  page_load: [3, 8]                      # بين كل صفحة وأخرى
  scroll: [1.5, 4]                       # بين كل سكرول وسكرول
  between_queries: [8, 25]               # بين كل استعلام واللي بعده — أهم فاصل
  jitter: true                           # عشوائية إجبارية فوق كل الفواصل

# --- البروكسي (اختياري لكن مستحسن للفيسبوك) ---
# صيغة سكني ثابت: http://user:pass@host:port — ثابت لنفس البروفايل دايمًا
proxy: ""                                # مثال: http://user:pass@residential.proxy:8000

# --- الاستعلامات (هتتفحص تباعًا حسب الميزانية) ---
queries:
  GOOGLE_MAPS:
    - "عيادات أسنان في القاهرة"
    - "عيادات أسنان في الجيزة"
    - "كافيهات في المعادي"
    - "مطاعم في مدينة نصر"
    - "صالونات تجميل في الإسكندرية"
    - "صيدليات في القاهرة الجديدة"
  FACEBOOK:
    - "كافيه المعادي فيسبوك"
    - "عيادة أسنان مصر فيسبوك"
    - "متجر ملابس اونلاين مصر فيسبوك"
  INSTAGRAM:
    - "براند ملابس مصري انستجرام"
    - "كافيه مصر انستجرام"
  LINKEDIN:
    - "شركة برمجيات مصر لينكدإن"
    - "مطعم تشين مصر لينكدإن"
  DIRECTORY:
    - "أدلة الشركات المصرية مطاعم"
    - "دليل مصانع مصر"

# --- منع الحظر المتقدم ---
safety:
  stop_on_bot_detection: true            # أول ما يظهر كابتشا/تدقيق بوت → قفل المنصة فورًا اليوم
  daily_reset_hour_utc: 21               # إعادة تصفير الميزانيات 21:00 UTC = منتصف الليل بتوقيت مصر تقريبًا
  min_results_to_stop: 3                 # لو 3 دورات متتالية صفر نتايج → راحة المنصة ساعة
  state_file: "state/guard.json"         # حالة الميزانيات والقواطع (تُحفظ محليًا)
