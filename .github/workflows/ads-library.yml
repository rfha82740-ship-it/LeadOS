# LeadOS — سكرابر مكتبة إعلانات فيسبوك (v2) (مستودع عام = دقايق Actions مجانية بلا سقف)
# بيفتح مكتبة الإعلانات بمتصفح حقيقي أنونيموس، بيستخرج المعلنين الممولين
# (أصحاب الميزانيات الحقيقية)، ويدفعهم ليدز AD_SPENDER لـLeadOS عبر webhook الاستقبال.
name: LeadOS Ads Library

on:
  schedule:
    - cron: "7 */2 * * *"       # (احتياطي لو الجداول اشتغلت يومًا)
  workflow_dispatch:             # زر تشغيل يدوي
    inputs:
      queries:
        description: "استعلامات مفصولة بفاصلة (فاضي = القائمة الافتراضية)"
        required: false
        default: ""
      max_queries:
        description: "أقصى عدد استعلامات في التشغيلة"
        required: false
        default: "5"
  repository_dispatch:
    types: [beat_adslib]

permissions:
  contents: write
  actions: write

concurrency:
  group: leados-adslib
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      LEADOS_BASE_URL: ${{ secrets.LEADOS_BASE_URL }}
      LEADOS_API_KEY: ${{ secrets.LEADOS_API_KEY }}
      COUNTRY: "EG"
      QUERIES: ${{ github.event.inputs.queries || '' }}
      MAX_QUERIES: ${{ github.event.inputs.max_queries || '5' }}
      TZ: Africa/Cairo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت كروميوم الحقيقي (playwright)
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: اسكراب مكتبة الإعلانات — دفعات متكررة ~40 دقيقة
        run: |
          # ═══ فرملة STOP: فحص بداية + فحص عن بُعد كل دفعة ═══
          if [ -f .github/STOP ]; then echo "🛑 .github/STOP موجودة — لا تشغيل"; exit 0; fi
          stop_now() { git fetch -q origin "${GITHUB_REF_NAME:-main}" 2>/dev/null || return 1; git cat-file -e "FETCH_HEAD:.github/STOP" 2>/dev/null; }
          PASS=0
          while [ $SECONDS -lt 2400 ]; do
            if stop_now; then echo "🛑 .github/STOP ظهرت عن بُعد — وقف فوري"; exit 0; fi
            PASS=$((PASS+1))
            echo "🎯 دفعة إعلانات #$PASS ($(date -u +%H:%M) UTC)"
            python scripts/adslib/scraper.py || echo "⚠️ دفعة $PASS فشلت — نكمل"
            sleep 240
          done
          echo "✅ AdsLib أنهى $PASS دفعات في $((SECONDS/60)) دقيقة"

      - name: 🔁 سلسلة دائمة — توليد الدفعة التالية
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f .github/STOP ]; then echo "🛑 .github/STOP موجودة — السلسلة واقفة"; exit 0; fi
          sleep 30
          code=$(curl -s -o /tmp/beat.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            -d '{"event_type":"beat_adslib"}')
          echo "beat_adslib -> HTTP $code (204 = الدفعة التالية انطلقت)"

      - name: حفظ عينة التشخيص عند الفشل
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: adslib-debug
          path: adslib-sample.html
          retention-days: 3
