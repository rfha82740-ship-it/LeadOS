# LeadOS — عمليات Vercel الإنتاجية من Actions (متاحات VERCEL_TOKEN السر الموجود)
# 1) يضبط GITHUB_TOKEN + GITHUB_REPO على الإنتاج (زر الإيقاف من لوحة التحكم — طلب #10)
# 2) يشخّص آخر deployments ويعيد نشر الإنتاج (حل لمخنوق النشر)
name: LeadOS Vercel Ops

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "mode: set-stop-env | status | redeploy"
        required: true
        default: "set-stop-env"
        type: choice
        options: [set-stop-env, status, redeploy, rotate-auth-secrets]

concurrency:
  group: leados-vercel-ops
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: وضع status — عرض آخر deployments
        if: github.event.inputs.mode == 'status'
        run: |
          npx vercel@59 ls --prod --token "$VERCEL_TOKEN" 2>&1 | tail -10

      - name: وضع set-stop-env — ضبط متغيرات زر الإيقاف + إعادة نشر
        if: github.event.inputs.mode == 'set-stop-env'
        env:
          GH_PAT: ${{ secrets.LEADOS_GH_PAT }}
        run: |
          npx vercel@59 env rm GITHUB_TOKEN production --yes --token "$VERCEL_TOKEN" || true
          printf '%s' "$GH_PAT" | npx vercel@59 env add GITHUB_TOKEN production --token "$VERCEL_TOKEN"
          npx vercel@59 env rm GITHUB_REPO production --yes --token "$VERCEL_TOKEN" || true
          printf '%s' "rfha82740-ship-it/LeadOS" | npx vercel@59 env add GITHUB_REPO production --token "$VERCEL_TOKEN"
          echo "✅ GITHUB_TOKEN + GITHUB_REPO اتحطوا على الإنتاج"
          npx vercel@59 deploy --prod --yes --token "$VERCEL_TOKEN" 2>&1 | tail -5

      - name: وضع redeploy — إعادة نشر من آخر كوميت
        if: github.event.inputs.mode == 'redeploy'
        run: |
          npx vercel@59 deploy --prod --yes --token "$VERCEL_TOKEN" 2>&1 | tail -8

      # تدوير الأسرار المكشوفة في Git history (Final Hardening #27):
      # القيمة بتتولد جوه الـrunner (openssl rand) — مش بتتطبع ولا بتتخزن في أي لوج.
      # بتتحدّث في Vercel (CRON_SECRET + AUTH_SECRET) وفي GitHub Secrets (CRON_SECRET للسلاسل).
      # أثر AUTH_SECRET: كل الجلسات الحالية تنتهي (دخول جديد مطلوب) — مقصود.
      - name: وضع rotate-auth-secrets — تدوير CRON_SECRET + AUTH_SECRET
        if: github.event.inputs.mode == 'rotate-auth-secrets'
        env:
          GH_PAT: ${{ secrets.LEADOS_GH_PAT }}
          GH_TOKEN: ${{ secrets.LEADOS_GH_PAT }}
        run: |
          NEW_CRON=$(openssl rand -hex 32)
          NEW_AUTH=$(openssl rand -hex 32)
          # Vercel
          npx vercel@59 env rm CRON_SECRET production --yes --token "$VERCEL_TOKEN" || true
          printf '%s' "$NEW_CRON" | npx vercel@59 env add CRON_SECRET production --token "$VERCEL_TOKEN"
          npx vercel@59 env rm AUTH_SECRET production --yes --token "$VERCEL_TOKEN" || true
          printf '%s' "$NEW_AUTH" | npx vercel@59 env add AUTH_SECRET production --token "$VERCEL_TOKEN"
          echo "✅ CRON_SECRET + AUTH_SECRET اتحدثوا على Vercel"
          # GitHub Secrets (السلاسل بتستخدم CRON_SECRET لتفعيل النبضة)
          gh secret set CRON_SECRET -b "$NEW_CRON" -R "$GITHUB_REPOSITORY"
          echo "✅ CRON_SECRET اتحدث في GitHub Secrets"
          # إعادة نشر عشان القيم الجديدة تشتغل على الـproduction
          npx vercel@59 deploy --prod --yes --token "$VERCEL_TOKEN" 2>&1 | tail -3
          echo "✅ تم النشر بالقيم الجديدة (المستخدم الخارجي للنبضة يحتاج تحديث السر الجديد من GitHub Secrets)"
