# LeadOS Worker على GitHub Actions (v3 دائم) — سلسلة مفرغة 24/7 عبر repository_dispatch
# ⚠️ مهم: GitHub Actions عناوينه داتا سنتر — مناسب لـ Google Maps والبحث العام فقط.
#    للفيسبوك المسجّل بالكوكيز استخدم VPS/Railway ببروكسي سكني.
name: LeadOS Worker

on:
  schedule:
    - cron: "0 */6 * * *"     # (احتياطي لو الجداول اشتغلت يومًا)
  workflow_dispatch: {}        # زر تشغيل يدوي من واجهة GitHub
  repository_dispatch:
    types: [beat_worker]

permissions:
  contents: write
  actions: write

concurrency:
  group: leados-worker
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      LEADOS_BASE_URL: ${{ secrets.LEADOS_BASE_URL }}
      LEADOS_API_KEY: ${{ secrets.LEADOS_API_KEY }}
      WORKER_MODE: "run"
      TZ: Africa/Cairo
    steps:
      - uses: actions/checkout@v4

      - name: استرجاع حالة الميزانيات من آخر تشغيل
        uses: actions/cache@v4
        with:
          path: worker/state
          key: leados-guard-state

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت كروميوم
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver xvfb fonts-noto-core

      - name: تثبيت المتطلبات
        working-directory: worker
        run: pip install -r requirements.txt

      - name: دورة اكتشاف — دورات متكررة ~45 دقيقة
        working-directory: worker
        run: |
          # ═══ فرملة STOP: فحص بداية + فحص عن بُعد كل دورة (الملف يشتغل حتى لو اتحط بعد الإقلاع) ═══
          if [ -f .github/STOP ]; then echo "🛑 .github/STOP موجودة — لا تشغيل"; exit 0; fi
          stop_now() { git fetch -q origin "${GITHUB_REF_NAME:-main}" 2>/dev/null || return 1; git cat-file -e "FETCH_HEAD:.github/STOP" 2>/dev/null; }
          # إعدادات وضع once لـ GitHub Actions
          python - <<'PY'
          import yaml, pathlib
          p = pathlib.Path("config.yaml")
          cfg = yaml.safe_load(p.read_text(encoding="utf-8"))
          cfg["worker"]["mode"] = "run"
          # على GH Actions نوقف فيسبوك المسجل بالكوكيز (IP داتا سنتر = خطر حظر)
          cfg["queries"].pop("FACEBOOK", None)
          p.write_text(yaml.dump(cfg, allow_unicode=True), encoding="utf-8")
          PY
          PASS=0
          while [ $SECONDS -lt 2640 ]; do
            if stop_now; then echo "🛑 .github/STOP ظهرت عن بُعد — وقف فوري"; exit 0; fi
            PASS=$((PASS+1))
            echo "⚙️ دورة اكتشاف #$PASS ($(date -u +%H:%M) UTC)"
            python bot.py run || echo "⚠️ دورة $PASS فيها أخطاء — نكمل"
            sleep 300
          done
          echo "✅ Worker أنهى $PASS دورة في $((SECONDS/60)) دقيقة"

      - name: 🔁 سلسلة دائمة — توليد الدفعة التالية
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f .github/STOP ]; then echo "🛑 .github/STOP موجودة — السلسلة واقفة"; exit 0; fi
          sleep 30
          code=$(curl -s -o /tmp/beat.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            -d '{"event_type":"beat_worker"}')
          echo "beat_worker -> HTTP $code (204 = الدفعة التالية انطلقت)"

      - name: حفظ مخرجات فشل (للتشخيص)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: worker-debug
          path: |
            worker/output
            worker/state
          retention-days: 3
