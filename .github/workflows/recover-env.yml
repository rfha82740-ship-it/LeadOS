# workflow مؤقت لاسترجاع إعدادات الإنتاج بعد reset الجهاز المحلي
name: Recover Prod Env

on:
  workflow_dispatch: {}

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: سحب إعدادات الإنتاج من Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel@59 env pull ./prod.env --yes --environment=production --token "$VERCEL_TOKEN" || true
          [ -s ./prod.env ] || cp -f .vercel/.env.production.local ./prod.env 2>/dev/null || true
          if [ ! -s ./prod.env ]; then echo "NO_ENV_FILE"; exit 0; fi
          echo "ENV_NAMES:"
          cut -d= -f1 ./prod.env | grep -E "^[A-Za-z_0-9]+" | sort -u | tr '\n' ' '
          echo ""
          cp ./prod.env ./secret.env

      - name: تشفير وطباعة المشفّر
        if: ${{ !cancelled() }}
        run: |
          if [ ! -s ./secret.env ]; then echo "SKIP_NO_FILE"; exit 0; fi
          cat > /tmp/pub.pem <<'PUBKEY'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAuG4SpNhHUrADp34AtC3x
          1hJ0IyHqvR2ownKFcPd7+TCWw2zXGTbu9l1KD6M7b6kRxCV+CI9Mk51n4rxQl6DC
          yxC/Re2f4xZz01KIi+lLK0RVOexzUMEJrrNHJxsb8cMqO03Wg/2XqzGCsCPtuM72
          PM5J40djk1LjpIQj6BKtZ+GV3JZpOMB3PaUohMvKQUAxjnLaysXa0sMoWqIQn0Qm
          NArSew1u/mNSnJ1fr00wZoW/3RzR/1VzZGqjgSY2XnL5YoVt5RPduheLzM/X7RmU
          gu+wf4/ZypmZA1oeP11hcM6d1zFlQxl+v0L1QM/iDu8ogWZjZ03PiNUNU2SVXJtb
          AwIDAQAB
          -----END PUBLIC KEY-----
          PUBKEY
          openssl pkeyutl -encrypt -pubin -inkey /tmp/pub.pem -in ./secret.env -out /tmp/secret.enc
          echo "ENC_B64_START"
          base64 -w0 /tmp/secret.enc
          echo ""
          echo "ENC_B64_END"
          rm -f ./secret.env
