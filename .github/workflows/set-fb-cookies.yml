# تحديث FACEBOOK_SESSION_COOKIE على Vercel الإنتاج من GitHub Secret (بدون أي ظهور في اللوج)
# + إعادة نشر عشان الجلسة تنفعل (env بتتقرأ وقت التشغيل)
# بعد كده النبضة (tick كل 10 دقايق) هتبدأ تمسح جروبات فيسبوك تلقائيًا
name: Set FB Cookies on Vercel

on:
  workflow_dispatch: {}

jobs:
  set-fb:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: كتابة الكوكيز الجديدة (rm + add)
        run: |
          npx vercel@59 env rm FACEBOOK_SESSION_COOKIE production --yes --token "$VERCEL_TOKEN" || true
          printf '%s' "${{ secrets.FACEBOOK_SESSION_COOKIE }}" | npx vercel@59 env add FACEBOOK_SESSION_COOKIE production --token "$VERCEL_TOKEN"
          echo "FACEBOOK_SESSION_COOKIE updated ✓ (قيمة مخفية)"

      - name: إعادة نشر الإنتاج لتفعيل الجلسة
        run: |
          npx vercel@59 deploy --prod --yes --token "$VERCEL_TOKEN" 2>&1 | tail -5
