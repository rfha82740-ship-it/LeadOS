# LeadOS — النابض الدائم (v3): نبضة /api/cron/tick كل 10 دقايق 24/7
# السلسلة المفرغة: كل تشغيلة بتعمل 5 نبضات (~50 دقيقة) وفي الآخر تولّد التشغيلة اللي بعدها
# عبر repository_dispatch (استثناء رسمي مسموح لـGITHUB_TOKEN) — مستقلة عن جدولات GitHub المعطلة.
# الفرامل: ملف .github/STOP في الريبو = وقف السلسلة.
name: LeadOS Cron Tick

on:
  schedule:
    - cron: "*/15 * * * *"    # (احتياطي لو الجداول اشتغلت يومًا)
  workflow_dispatch: {}        # زر تشغيل يدوي
  repository_dispatch:
    types: [beat_tick]

permissions:
  contents: write
  actions: write

concurrency:
  group: leados-cron-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4

      - name: 5 نبضات كل 10 دقايق (~50 دقيقة)
        run: |
          # ═══ فرملة STOP: فحص بداية + فحص عن بُعد قبل كل نبضة ═══
          if [ -f .github/STOP ]; then echo "🛑 .github/STOP موجودة — لا تشغيل"; exit 0; fi
          stop_now() { git fetch -q origin "${GITHUB_REF_NAME:-main}" 2>/dev/null || return 1; git cat-file -e "FETCH_HEAD:.github/STOP" 2>/dev/null; }
          for i in 1 2 3 4 5; do
            if stop_now; then echo "🛑 .github/STOP ظهرت عن بُعد — وقف فوري"; exit 0; fi
            echo "💓 نبضة $i/5 ($(date -u +%H:%M) UTC)"
            RESPONSE=$(curl -sS -m 120 -w "\nHTTP_STATUS:%{http_code}" \
              -X POST "${{ secrets.LEADOS_BASE_URL }}/api/cron/tick?secret=${{ secrets.CRON_SECRET }}" \
              -H "Content-Type: application/json" || true)
            echo "$RESPONSE" | tail -3
            echo "$RESPONSE" | grep -q "HTTP_STATUS:200" || echo "::warning::tick did not return 200"
            [ $i -lt 5 ] && sleep 600
          done
          echo "✅ النابض خلّص 5 نبضات في $((SECONDS/60)) دقيقة"

      - name: 🔁 سلسلة دائمة — توليد النبضة التالية
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f .github/STOP ]; then echo "🛑 .github/STOP موجودة — السلسلة واقفة (احذف الملف لاستئناف الدائم)"; exit 0; fi
          node scripts/capacity-gate.mjs --chain tick
          gate=$?
          if [ $gate -eq 2 ]; then echo "⏳ بوابة السعة أجّلت الجيل التالي — النبضة هتحييها"; exit 0; fi
          if [ $gate -ne 0 ]; then echo "⚠️ فشل بوابة السعة (exit $gate) — نكمل fail-open"; fi
          sleep 30
          code=$(curl -s -o /tmp/beat.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            -d '{"event_type":"beat_tick"}')
          echo "beat_tick -> HTTP $code (204 = النبضة التالية انطلقت)"
